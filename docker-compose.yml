version: '3.4'

services:

  backend:
    container_name: mymeetings_backend
    build:
      context: ./src/
    ports:
      - "5000:8080"
    networks:
      - starfish-crm-network
    environment:
      - Meetings_MeetingsConnectionString=Server=mymeetingsdb,1433;Database=MyMeetings;User=sa;Password=${SA_PASSWORD};Encrypt=False;
    depends_on:
      - migrator
    restart: on-failure

  mymeetingsdb:
    build: ./src/Database/
    platform: linux/amd64
    ports:
      - 1445:1433
    networks:
      - starfish-crm-network
    environment:
      - SA_PASSWORD=${SA_PASSWORD}

  migrator:
    container_name: mymeetings_db_migrator
    build:
      context: ./src/
      dockerfile: ./Database/Dockerfile_DatabaseMigrator
    networks:
      - starfish-crm-network
    environment:
      - ASPNETCORE_MyMeetings_IntegrationTests_ConnectionString=Server=mymeetingsdb,1433;Database=MyMeetings;User=sa;Password=${SA_PASSWORD};Encrypt=False;
    command:
      [
        "./wait-for-it.sh",
        "mymeetingsdb:1433",
        "--timeout=60",
        "--",
        "/bin/bash",
        "/entrypoint_DatabaseMigrator.sh"
      ]
    restart: on-failure

networks:
  starfish-crm-network:
